# hypxrvoice — example configuration.
# Copy to $XDG_CONFIG_HOME/hypxrvoice/config.toml (usually ~/.config/hypxrvoice/config.toml).
# Reload a running daemon after editing with:  hypxrvoicectl reload

[activation]
# auto = follow the compositor (at keyboard -> PTT only; away / headset donned -> wake armed)
# ptt  = push-to-talk only, never auto-arm the wake word (maximally private)
# wake = always wake-word armed, ignore the compositor
mode = "auto"

# When the compositor / openxr status is unavailable: "wake" (arm) or "gate" (PTT only).
fallback = "wake"

# Reserved for a future local at-keyboard heuristic (ms). The compositor signal is
# primary today.
keyboard_idle_ms = 3000

[audio]
# PipeWire source node name. Empty = the default source. At the desk this is your
# desk mic; in the headset the daemon prefers `headset_source` below when the
# compositor reports the headset is present.
source = ""
headset_source = "wivrn.source"
sample_rate = 16000

[capture]
# Capture-stream lifetime. Opening the PipeWire stream at each PTT press costs a stream
# connect PLUS a `wivrn.source` resume from SUSPENDED — and resuming that source makes the
# WiVRn server ask the headset client to start its microphone over the network. That is
# ~0.5-1 s during which you are already talking, so the leading verb of every command used
# to be missing ("terminal to the left monitor" for "move terminal to the left monitor")
# and short utterances vanished entirely.
#
# hold = true keeps the stream CONNECTED between windows whenever the headset is present
# (a desk source opens locally and fast, so it is left alone). While no window is open the
# frames go nowhere but the pre-roll ring below: never to the VAD, ASR, or wake-word tier,
# never to disk. On the next PTT press the ring is spliced in front of the live audio, so
# speech that started before the press is still transcribed.
#
# TRADE-OFF: a held stream keeps `wivrn.source` running, which keeps the headset mic
# streaming — a small continuous battery cost on the headset. Wake-word mode already
# behaved this way. Set hold = false for per-window streams (and accept losing the first
# word again). `hypxrvoicectl status` reports captureHeld / captureActive / preRollBufferedMs.
hold = true
preroll_ms = 1000       # rolling pre-roll spliced in front of a new window; 0 disables it

# Transcribe the WHOLE push-to-talk window rather than the slice the VAD picked out of it.
# A press is an explicit declaration that speech is coming, so nothing about what reaches
# whisper is gated on onset detection; the VAD is demoted to (a) endpointing early, so a
# short utterance need not wait out the window, and (b) a much more forgiving "was there
# anything at all in this window" verdict. Live round 3 lost "focus" out of "focus the
# browser" and dropped "workspace three" entirely to the onset gate, with both plainly
# audible in the dumped window audio. Set false to restore the old per-segment behaviour.
ptt_whole_window = true

[vad]
# Energy-gated voice activity detection. Raise energy_threshold if background noise
# false-triggers; lower it if quiet speech is missed.
#
# 0.006 and not 0.012: the Quest/WiVRn headset mic is unprocessed (no AGC). Across all
# seven capture windows dumped in live round 3 its ambient sits at a 20th-percentile frame
# RMS of ~0.0002 while speech peaks at only ~0.03, and at 0.012 a whole spoken word could
# put less than start_ms of audio over the gate. The adaptive gating below — not this
# number — is what protects a hot source.
energy_threshold = 0.006
start_ms = 150          # sustained voiced audio before declaring speech onset
end_ms = 600            # trailing silence (hangover) before ending an utterance
max_utterance_ms = 12000
pre_roll_ms = 300       # raw depth of the idle retention ring

# How long an unvoiced DIP inside the onset run may last before the run is thrown away.
# start_ms used to require that many CONSECUTIVE voiced frames, which no real word
# delivers — "focus" has a stop gap before its /k/, "workspace" one before its /sp/ — so a
# short quiet word could never declare onset at all. The run now PAUSES across a short gap
# instead of resetting; only voiced frames count toward start_ms, so the gate is no looser
# on noise. Replaying the live "focus the browser" window, 100 ms moves onset 2.82 s (the
# word "browser") back to 2.04 s (the word "focus").
gap_tolerance_ms = 100

# How much energetic audio ANYWHERE in a push-to-talk window counts as "somebody spoke".
# Only used by ptt_whole_window, and only to keep several seconds of pure silence away
# from whisper — it needs no contiguity and gates below the detector itself, so anything
# that might be speech is transcribed and left for the intent tier to reject.
presence_ms = 100

# Audio GUARANTEED to sit in front of the DECLARED onset instant. This is NOT the same
# thing as pre_roll_ms: the ring is fed every idle frame, including the start_ms of
# voiced audio that declares onset, and onset is back-dated to the first of those — so
# pre_roll_ms alone left only (pre_roll_ms - start_ms) = 150 ms ahead of onset at the old
# defaults. A quiet first syllable (an unvoiced fricative, or any source whose gain is
# still ramping when you start talking) sat in that gap and was dropped even though it
# was in the buffer the whole time, which is what produced transcripts like "browser."
# for "focus the browser". Raise this if leading words are still clipped.
onset_backpad_ms = 300

[wake]
enabled = true
# vad-transcribe: transcribe armed speech and match the phrase in the transcript
#                 (fully local, no extra models). openwakeword: reserved (WP-V7).
backend = "vad-transcribe"
phrase = "hey hypr"
fuzz = 2                # per-word edit-distance tolerance for the phrase match

[asr]
# REQUIRED to transcribe. Fetch with scripts/fetch-models.sh, then set the path:
model = ""              # e.g. "~/.local/share/hypxrvoice/models/ggml-base.en.bin"
language = "en"
threads = 4
translate = false

[feedback]
stdout_json = true      # print each transcript as a JSON line on stdout
notify = true           # notify-send toast (fallback when the HUD isn't showing it)

# ---- in-headset HUD (WP-H8: a D-Bus client of the shared hypxrhud daemon) ----
# hypxrvoice no longer renders the HUD itself. It pushes a panel to the shared `hypxrhud`
# daemon (io.github.andrewgaspar.hypxrhud1), which owns the OpenXR overlay, the rendering,
# the geometry, and the fades for the whole HypXRland ecosystem. It shows the live
# transcript while listening and the parsed action (target, verb, confidence, clarify
# candidates) as your VETO window before/as it executes. Degrades cleanly to notify-send
# when hypxrhud is absent or its RuntimeState is not "live" (no headset/runtime donned).
# Install + enable hypxrhud for the HUD to appear (or rely on its D-Bus bus activation).
hud = true
hud_slot = "voice"          # which hypxrhud slot the voice panel targets

# MOVED to hypxrhud config (~/.config/hypxrhud/hypxrhud.toml) — these are no longer
# hypxrvoice's concern. Set them THERE instead:
#   hud_pose / hud_size   -> [slot.voice]  pose = "x,y,z", size = <metres>
#   hud_opacity           -> [hud]  opacity
#   hud_hold_ms/hud_fade_ms (+ rise) -> [hud]  hold_ms / fade_ms / rise_ms envelope
#   hud_z                 -> [hud]  z   (overlay stacking; keep distinct from HypXRland's
#                                       openxr:overlay_z)
#   hud_gpu               -> [hud]  gpu (DRM render node; match the XR runtime's GPU)
# Any leftover feedback.hud_* keys here still load — they log a one-line "moved" warning.

# ---- WP-V5: terse TTS (spoken confirmations) ----
# Confirms what you can't see on the HUD. "off" | "errors" (refusals + clarify) |
# "all" (also success). Needs the `espeak-ng` binary on PATH, else cleanly disabled.
tts = "errors"
tts_voice = ""              # espeak-ng voice name, empty = its default (e.g. "en-us")
tts_rate = 175             # words per minute

[compositor]
enabled = true          # poll `hyprctl openxr status -j`
poll_ms = 1000

# ---- WP-V4: intent tier (transcript -> typed command) ----
[intent]
enabled = true
# backend = "rule"  : deterministic keyword grammar (fast, offline, no model). Default.
# backend = "llama" : local GGUF, GBNF-constrained to the command schema. Needs `model`.
backend = "rule"
model = ""              # e.g. "~/.local/share/hypxrvoice/models/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
temperature = 0.0       # 0 = greedy/deterministic (recommended for command parsing)
threads = 4
context_max_monitors = 16   # digest caps (bound the prompt size)
context_max_apps = 6
# Deixis ("this"/"here") resolution against the gaze ring. Gaze leads speech, and ASR
# word timestamps are noisy, so we query a lead-shifted stability window at word time.
deixis_window_ms = 300      # span sampled ending at the lead-shifted target
deixis_lead_ms = 200        # shift the query earlier (gaze precedes the spoken word)
deixis_samples = 5          # ring points sampled across the window (modal pick)
distance_step_m = 0.25      # "closer"/"further" step
# WHERE "HERE" IS. A gaze sample gives a head ORIGIN and a direction; the point a
# place-deixis designates is projected this far along that ray. Passing the head origin
# straight to `openxr place` is what dropped a monitor AT the HMD on the first live-fire
# round — the projection is not optional.
place_distance_m = 1.3      # arm's-length-plus, the natural "here" for a monitor
# Hard floor on the distance from your head to any placed monitor. Every candidate point
# — projected or compositor-reported — is pushed out to at least this, so a monitor
# cannot land inside your head no matter what the gaze data says.
place_min_distance_m = 0.5

# ---- WP-V4: executor (typed command -> allowlisted hyprctl argv) ----
[executor]
# DEFAULT TRUE: log the exact hyprctl argv and actuate NOTHING. Flip to false only
# once you trust the pipeline on your setup.
dry_run = true
allow_xrmonitor = true  # permit openxr/xrmonitor actuation (when dry_run=false)
allow_launch = false    # permit app launch — only from the [apps] allowlist below
# Compositor verbs from docs/COMPOSITOR-GAPS.md — SHIPPED in HypXRland 727c457e+
# (targeted `gazegrab <name>`, `place <name> at x,y,z`). On older builds set these
# false and the executor falls back to the documented approximations. Note: confirm
# a targeted grab via `gaze.carrying`/`gaze.carryMonitor` in `-j openxr status`,
# not the per-monitor `grabbed` flag (that flag is hand/controller grabs only).
targeted_grab = true    # `openxr gazegrab <name>` — grab a NAMED monitor
place_at_pose = true    # `openxr place <name> at x,y,z` — drop at the resolved gaze point
# Plain window management: "focus the browser", "make this window fullscreen",
# "workspace three". These drive Hyprland rather than the XR layer and are
# non-destructive and reversible — nothing in this class can close, kill, or relocate a
# window — so they are permitted by default. dry_run still gates whether they run.
allow_window = true
# "create a monitor here" -> `openxr create XR-<n> <WxH@Hz>` (plus a place step when the
# utterance carried a deixis). The name is minted by the daemon from the live monitor
# list, never spoken. Additive and individually undoable (`hyprctl openxr destroy`).
allow_create_monitor = true
# A plan step may depend on a monitor an EARLIER step created. `openxr create` returns as
# soon as the compositor accepts the request, but the output is registered asynchronously,
# so the `place` that follows can arrive before the name exists (observed live: create+place
# failed at 21:51, the identical pair succeeded at 22:07). The dependent step waits for the
# monitor, polling every 100 ms, and refuses rather than dispatching at a name that never
# appeared. 0 disables the wait.
wait_monitor_ms = 2000

# ---- capture forensics (OFF by default — turn on only while debugging) ----
# Setting dump_audio_dir writes MICROPHONE AUDIO TO DISK: for every capture window, the
# full window audio (pre-roll splice included), each segment handed to whisper, and a
# sidecar .txt recording the splice point and the VAD boundaries. It exists to answer one
# question — when a leading word is missing, was it never in the audio (source-side gating
# on the headset mic) or did our segmenter cut it? Compare the -window.wav against the
# -segN.wav and the answer is a waveform rather than an argument. The daemon logs a
# standing WARN for as long as this is set; unset it when you are done.
[debug]
# dump_audio_dir = "/tmp/hypxrvoice-dumps"
dump_audio_keep = 50    # windows retained on disk; older ones are pruned

# ---- app-launch allowlist: spoken alias -> a TRUSTED launch command ----
# Never derived from transcript text. Use the uwsm/systemd-run pattern.
[apps]
# browser = "uwsm app -- firefox.desktop"
# terminal = "uwsm app -- Alacritty.desktop"
