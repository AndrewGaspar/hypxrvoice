# Example Hyprland binds for hypxrvoice — DO NOT paste blindly.
#
# These are a STARTING POINT, not a drop-in. The compositor repo's hard lesson
# applies: every bind must be validated against YOUR Omarchy / Hyprland config so it
# does not collide with an existing binding. Check first, e.g.:
#   hyprctl binds | grep -i ', V'          # is SUPER+V already taken?
# and adjust the modifier/key to a free chord before adding these.
#
# Push-to-talk (hold): press to open the mic, release to transcribe. Requires the
# daemon running (systemd user service or exec-once).
bind  = SUPER, V, exec, hypxrvoicectl ptt start
bindr = SUPER, V, exec, hypxrvoicectl ptt stop

# Alternative: toggle (tap once to start, again to stop) — pick ONE style, not both.
# bind = SUPER, V, exec, hypxrvoicectl ptt toggle

# Optional: launch the daemon with the session (if not using the systemd unit).
# exec-once = hypxrvoiced

# Optional: make HYPRLAND_INSTANCE_SIGNATURE visible to a systemd user unit.
# exec-once = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_RUNTIME_DIR
